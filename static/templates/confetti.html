<div style="text-align: center; margin: 10px 0;">
    <canvas id="confettiCanvas" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 99999;"></canvas>
    <script>
        (function() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) {
                    const ctx = new AudioCtx();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime({{freq_start}}, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime({{freq_end}}, ctx.currentTime + 0.35);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                }
            } catch(e) {}

            const canvas = document.getElementById('confettiCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#2563eb', '#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899'];

            for (let i = 0; i < {{particle_count}}; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height * 0.4,
                    r: Math.random() * 6 + 3,
                    d: Math.random() * 50,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.floor(Math.random() * 10) - 10,
                    tiltAngleIncremental: (Math.random() * 0.07) + 0.05,
                    tiltAngle: 0,
                    vx: (Math.random() - 0.5) * 16,
                    vy: (Math.random() - 0.7) * 14
                });
            }

            let animationFrame;
            let start = Date.now();

            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    p.tiltAngle += p.tiltAngleIncremental;
                    p.y += (Math.cos(p.d) + 3 + p.r / 2) / 2 + p.vy;
                    p.x += Math.sin(p.d) * 2 + p.vx;
                    p.tilt = Math.sin(p.tiltAngle - (i / 3)) * 15;
                    p.vy += 0.2;

                    ctx.beginPath();
                    ctx.lineWidth = p.r;
                    ctx.strokeStyle = p.color;
                    ctx.moveTo(p.x + p.tilt + (p.r / 2), p.y);
                    ctx.lineTo(p.x + p.tilt, p.y + p.tilt + (p.r / 2));
                    ctx.stroke();
                }

                if (Date.now() - start < 3500) {
                    animationFrame = requestAnimationFrame(render);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    canvas.remove();
                }
            }
            render();
        })();
    </script>
</div>
