<div style="
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    border: 2px solid #3b82f6;
    border-radius: 18px;
    padding: 18px 24px;
    color: white;
    margin-bottom: 14px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
">
    <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px;">
        <div style="display: flex; align-items: center; gap: 16px;">
            <div style="
                font-size: 2.3rem;
                background: rgba(59, 130, 246, 0.2);
                width: 56px;
                height: 56px;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 50%;
                border: 2px solid #60a5fa;
            ">👩‍🏫</div>
            <div>
                <div style="font-weight: 800; font-size: 1.15rem; color: #93c5fd; display: flex; align-items: center; gap: 8px;">
                    Frau Wagner (Audio-Nachricht)
                    <span style="font-size: 0.72rem; background: #2563eb; color: white; padding: 2px 8px; border-radius: 999px; font-weight: 600;">Goethe B1 Audio</span>
                </div>
                <div style="font-size: 0.85rem; color: #94a3b8; margin-top: 3px;">
                    🎧 <strong>Blind Mode</strong>: Listen without reading text! (వినండి / ಕೇಳಿ)
                </div>
            </div>
        </div>

        <div style="display: flex; align-items: center; gap: 10px;">
            <button id="btn_{{button_id}}" onclick="playAudio_{{button_id}}()" style="
                background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
                color: white;
                border: none;
                border-radius: 12px;
                padding: 10px 22px;
                font-size: 14px;
                font-weight: 700;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 8px;
                box-shadow: 0 4px 14px rgba(37,99,235,0.4);
                transition: all 0.2s ease;
            " onmouseover="this.style.transform='scale(1.05)';" onmouseout="this.style.transform='scale(1)';">
                <span style="font-size: 1.3rem;">🔊</span>
                <span>Replay German Voice</span>
            </button>
        </div>
    </div>

    <div style="margin-top: 14px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: space-between;">
        <div id="status_{{button_id}}" style="font-size: 0.82rem; color: #60a5fa; font-weight: 600;">
            ● Ready to play German voice
        </div>
        <div style="font-size: 0.75rem; color: #94a3b8;">
            (Transcript & Telugu/Kannada hints below)
        </div>
    </div>
</div>

<script>
    function playAudio_{{button_id}}() {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            var utter = new SpeechSynthesisUtterance({{safe_text}});
            utter.lang = 'de-DE';
            utter.rate = 0.88;
            utter.pitch = 1.0;

            const statusEl = document.getElementById('status_{{button_id}}');
            if (statusEl) {
                statusEl.innerText = "▶️ Frau Wagner spricht Deutsch... (Speaking...)";
                statusEl.style.color = "#34d399";
            }

            utter.onend = function() {
                if (statusEl) {
                    statusEl.innerText = "✅ Finished speaking. Record your reply below!";
                    statusEl.style.color = "#60a5fa";
                }
            };
            utter.onerror = function() {
                if (statusEl) statusEl.innerText = "Audio playback ended.";
            };

            window.speechSynthesis.speak(utter);
        } else {
            alert('Speech synthesis is not supported in this browser.');
        }
    }
    {{auto_trigger}}
</script>
